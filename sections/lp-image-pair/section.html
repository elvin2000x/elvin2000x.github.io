<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    {{#heading}}<h2>{{heading}}</h2>{{/heading}}
    <div class="lp-pair">
      <figure class="lp-pair__fig"><img src="{{first}}" alt="{{first_alt}}" loading="lazy" decoding="async" /></figure>
      <figure class="lp-pair__fig"><img src="{{second}}" alt="{{second_alt}}" loading="lazy" decoding="async" /></figure>
    </div>
  </div>
</section>
