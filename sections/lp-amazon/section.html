    <h2>{{heading}}</h2>
    <div class="ep-row ep-row--center">
{{#buttons}}

{{/buttons}}
    </div>
    <p class="amz-disclosure">As an Amazon Associate I earn from qualifying purchases.</p>
  </div>
</section>
