  <style>
    /* Homepage v3 (2026-09-27): one argument top to bottom. Light only (Rule 34). Phone first.
       One heading style (serif, sentence case), one button style, cards only for the demo and the review. */
    :root{ --wrap: 680px; --wide: 1040px; }
    body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:18px; line-height:1.6; }
    @media(min-width:900px){ body{ font-size:17px } }
    a{ color:var(--accent-ink) }
    a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible{ outline:2px solid var(--accent-hi); outline-offset:2px }
    img{ max-width:100%; height:auto }
    h1, h2, h3{ font-family:var(--serif); font-weight:600; letter-spacing:-.01em; text-wrap:balance; color:var(--ink) }

    /* nav: links go into the burger on phones; the buy button always stays in the bar */
    .nav{ position:sticky; top:0; z-index:40; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-bottom:1px solid var(--line-soft) }
    .nav .container{ max-width:var(--wide); margin:0 auto; padding:0 16px; height:var(--nav-h); display:flex; align-items:center; gap:12px }
    .brandmark{ display:flex; align-items:center; min-height:var(--tap); gap:8px; font:600 18px/1 var(--serif); color:var(--ink); text-decoration:none }
    .nav .links{ margin-left:auto; display:flex; align-items:center; gap:4px }
    .nav .links a{ color:var(--ink-2); text-decoration:none; font-size:15px; font-weight:500; padding:10px 12px; border-radius:var(--r-sm) }
    .nav .links a:hover{ color:var(--ink); background:var(--bg-2) }
    .nav-buy{ min-height:var(--tap); display:inline-flex; align-items:center; padding:0 16px; font-size:15px; font-weight:600; white-space:nowrap }
    @media(max-width:920px){ .nav-buy{ margin-left:auto } }

    .sec{ padding:64px 16px }
    @media(min-width:900px){ .sec{ padding:96px 24px } }
    .sec--tint{ background:var(--bg-2) }
    .in{ max-width:var(--wrap); margin:0 auto }
    .in--wide{ max-width:var(--wide); margin:0 auto }
    .eyebrow{ display:block; font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:10px }
    .sec h2{ font-size:clamp(30px,6.4vw,44px); line-height:1.15; margin:0 0 18px }
    .sec p{ margin:0 0 16px; color:var(--ink-2) }
    .sec p strong{ color:var(--ink); font-weight:600 }
    .lede{ font-size:20px; line-height:1.55 }

    /* one button style, one secondary link style */
    .amz-btn{ min-height:52px; display:inline-flex; align-items:center; justify-content:center; padding:0 26px; font-size:18px; font-weight:600 }
    .buyblock{ display:flex; flex-direction:column; align-items:flex-start; gap:12px }
    .buyblock--center{ align-items:center; text-align:center }
    .avail{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:15px; color:var(--muted) }
    .badge-btn{ display:inline-flex; align-items:center; min-height:var(--tap); line-height:0 }
    .badge-btn img{ width:150px; height:auto; display:block }
    .badge-btn .amz-on-dark{ display:none }
    [data-theme="dark"] .badge-btn .amz-on-light{ display:none } [data-theme="dark"] .badge-btn .amz-on-dark{ display:block }
    .sec p.value{ font:italic 20px/1.45 var(--serif); color:var(--ink); margin:0 0 18px }
    .sample{ font-size:16px; font-weight:600; text-decoration:none; min-height:var(--tap); display:inline-flex; align-items:center }
    .sample:hover{ text-decoration:underline }

    /* hero: words and button first on phones, the book beside them on desktop */
    .hero{ background:linear-gradient(170deg,var(--panel) 0%,var(--bg-2) 100%); padding:32px 16px 48px }
    .hero .in--wide{ display:grid; gap:24px; align-items:center }
    .hero h1{ font-size:clamp(38px,9.6vw,66px); line-height:1.08; margin:0 0 16px }
    .hero h1 span{ font-style:italic; color:var(--accent-ink) }
    .hero-sub{ font-size:19px; color:var(--ink-2); margin:0 0 20px; max-width:34em }
    .hero-sub:empty{ display:none }
    .trust{ font-size:15px; color:var(--muted); margin:18px 0 0; max-width:34em; padding-top:14px; border-top:1px solid var(--line) }
    .trust strong{ color:var(--ink-2) }
    .hero-art{ display:flex; justify-content:center }
    .hero-art img{ width:min(52vw,220px) }
    @media(min-width:900px){
      .hero{ padding:64px 24px 80px }
      .hero .in--wide{ grid-template-columns:1.3fr .7fr; gap:48px }
      .hero-art img{ width:320px }
    }

    /* the demo: two chat panels */
    .demo-pair{ display:grid; gap:14px; margin:8px 0 18px }
    @media(min-width:760px){ .demo-pair{ grid-template-columns:1fr 1fr } }
    .chat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-card); padding:18px }
    .chat--after{ border-color:var(--accent); box-shadow:0 12px 30px -22px rgba(10,24,40,.45) }
    .chat-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
    .chat--after .chat-h span:first-child{ color:var(--accent-ink) }
    .timer{ font-size:14px; letter-spacing:0; text-transform:none; font-weight:700; padding:4px 10px; border-radius:999px; font-variant-numeric:tabular-nums }
    .timer--slow{ background:#f6e4e4; color:#8f2f2f }
    .timer--fast{ background:#e2f1e6; color:#1f6b3a }
    .bubble{ background:var(--bg-2); border-radius:14px 14px 14px 4px; padding:12px 14px; font-size:16px !important; color:var(--ink) !important; margin:0 0 12px !important }
    .chat--after .bubble{ background:#fbf5e6 }
    .chat-out{ font-size:16px !important; margin:0 !important }
    .res{ display:block; font-family:var(--serif); font-size:17px; color:var(--ink) }
    .more{ margin:6px 0 24px }
    .more > summary{ list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; min-height:var(--tap); font-weight:600; color:var(--accent-ink) }
    .more > summary::-webkit-details-marker{ display:none }
    .more > summary::after{ content:"+"; font-size:22px }
    .more[open] > summary::after{ content:"–" }
    .more[open] > summary{ margin-bottom:14px }
    .pullline{ font:italic 24px/1.4 var(--serif); color:var(--ink); margin:8px 0 0 }

    /* the review: one big quote, two small labelled lines */
    /* review card, same look as /book */
    .quote{ margin:0; background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:var(--r-card); padding:26px 22px }
    @media(min-width:760px){ .quote{ padding:28px 32px } }
    .quote .head{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px }
    .stars{ color:var(--accent); letter-spacing:2px; font-size:20px }
    .vp{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ok) }
    .quote h3{ margin:12px 0 12px; font:600 clamp(22px,4.6vw,26px)/1.3 var(--serif); color:var(--ink) }
    .quote p{ font-size:17px; line-height:1.7; color:var(--ink-2); margin:0 0 12px }
    .quote .meta{ font-size:15px; color:var(--muted); margin:6px 0 0; line-height:1.6 }
    .quote .meta a{ color:var(--accent-ink); font-weight:600; display:inline-block; padding:10px 0 }
    .friends{ display:grid; gap:18px; margin-top:28px }
    @media(min-width:760px){ .friends{ grid-template-columns:1fr 1fr } }
    .friends figure{ margin:0; padding-left:16px; border-left:3px solid var(--line-strong) }
    .friends blockquote{ margin:0 0 6px; font:italic 21px/1.4 var(--serif); color:var(--ink) }
    .friends figcaption{ font-size:14px; color:var(--muted) }

    /* what you'll be able to do: plain rows, no boxes */
    .parts{ margin:8px 0 28px; border-top:1px solid var(--line) }
    .part{ border-bottom:1px solid var(--line) }
    .part > summary{ list-style:none; cursor:pointer; padding:18px 0; display:grid; grid-template-columns:1fr auto; gap:4px 12px; min-height:var(--tap) }
    .part > summary::-webkit-details-marker{ display:none }
    .part .pn{ font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink) }
    .part .pt{ grid-column:1; font:600 22px/1.3 var(--serif); color:var(--ink) }
    .part .pi{ grid-row:1 / span 2; grid-column:2; align-self:center; font-size:24px; color:var(--accent-ink) }
    .part[open] .pi{ transform:rotate(45deg) }
    .part ul{ margin:0; padding:0 0 18px 20px; color:var(--ink-2); font-size:16px }
    .part li{ margin:6px 0 }
    @media (prefers-reduced-motion:no-preference){ .part .pi{ transition:transform .2s } }

    /* who it's for: three plain lines */
    .who{ list-style:none; margin:8px 0 0; padding:0; display:grid; gap:22px }
    .who li{ padding-left:18px; border-left:3px solid var(--accent) }
    .who b{ display:block; font:600 22px/1.3 var(--serif); color:var(--ink); margin-bottom:4px }
    .who span{ color:var(--ink-2); font-size:17px }

    /* author */
    .author{ display:grid; gap:22px; align-items:start }
    .author img{ width:120px; height:120px; border-radius:50%; object-fit:cover }
    .author .role{ font-size:15px; color:var(--muted); margin:-10px 0 16px }
    @media(min-width:900px){ .author{ grid-template-columns:auto 1fr; gap:36px } .author img{ width:160px; height:160px } }

    /* FAQ */
    .faq{ border-top:1px solid var(--line) }
    .faq details{ border-bottom:1px solid var(--line) }
    .faq summary{ list-style:none; cursor:pointer; display:flex; justify-content:space-between; gap:16px; align-items:center; padding:16px 0; min-height:var(--tap); font-weight:600; font-size:18px; color:var(--ink) }
    .faq summary::-webkit-details-marker{ display:none }
    .faq summary::after{ content:"+"; font-size:24px; color:var(--accent-ink); flex:none }
    .faq details[open] summary::after{ content:"–" }
    .faq details p{ margin:0 0 18px }

    /* close */
    .close .in--wide{ display:grid; gap:28px; align-items:center }
    .close .desk{ width:min(80vw,360px); margin:0 auto; border-radius:var(--r-card); box-shadow:0 24px 50px -30px rgba(10,24,40,.55) }
    @media(min-width:900px){ .close .in--wide{ grid-template-columns:auto 1fr; gap:56px } .close .desk{ width:400px } }
    .sec--line{ border-top:1px solid var(--line) }

    /* email ask */
    .optin{ margin:0 auto }
    .optin input[type=email]{ font-size:16px }

    footer.foot{ border-top:1px solid var(--line); padding:32px 16px 40px; font-size:15px; color:var(--muted) }
    footer.foot .in--wide{ display:flex; flex-wrap:wrap; gap:12px 24px; justify-content:space-between }
    footer.foot nav{ display:flex; flex-wrap:wrap; gap:4px 18px }
    footer.foot a{ color:var(--ink-2); text-decoration:none; min-height:var(--tap); display:inline-flex; align-items:center }
    footer.foot a:hover{ color:var(--accent-ink) }
  </style>
</head>

<script>
  /* The Amazon link lives in ONE constant. The 2E upload may change the ASIN
     (plan v2, section 6): change it here and every buy link on the page follows. */
  var AMAZON_URL = 'https://www.amazon.com/dp/B0H4X2S2JD';
  document.querySelectorAll('a[data-amazon]').forEach(function (a) {
    a.href = AMAZON_URL;
    a.addEventListener('click', function () {
      /* Outbound to Amazon is not a checkout event (see /book.html history). */
      try { gtag('event', 'amazon_outbound', { event_label: a.getAttribute('aria-label') || a.textContent.trim() }); } catch (e) {}
    });
  });

  /* Dynamic audience-matched headline (DTR), ported unchanged from /book.html.
     Ad URLs append ?aud=<segment> or ?v=<angle>; no param keeps the HTML default. */
  (function () {
    var AUD = {
      "skeptic":  { hl: "You tried AI and<br/><span>weren't impressed.</span>",
                    sub: "The problem wasn't the tool. It was that no one taught you to direct it. Here's the framework that fixes that.",
                    hook: "The people getting astonishing results are typing into the same box you are. They just learned to direct it." },
      "jobsec":   { hl: "AI won't take your job.<br/><span>Someone who uses it better will.</span>",
                    sub: "Become that someone. This is the framework that turns AI from a gimmick into your unfair advantage at work.",
                    hook: "It has almost nothing to do with being technical. It is a learnable skill, and most professionals never learn it." },
      "senior":   { hl: "You're not too old for AI.<br/><span>You just need a system.</span>",
                    sub: "Not a tech degree, a framework. If you can send an email, you can master this in a weekend of reading.",
                    hook: "Written for professionals with zero technical background. Plain language, real work tasks, start to finish." },
      "lowtech":  { hl: "If you can send an email,<br/><span>you can master AI.</span>",
                    sub: "Zero code. Zero jargon. The directing framework that finally makes AI deliver for non-technical professionals.",
                    hook: "The gap was never about being technical. It was about being taught how to direct the tool." },
      "student":  { hl: "Graduate already<br/><span>ahead of the room.</span>",
                    sub: "The AI edge that outranks GPA. Learn to direct AI like the professionals who'll be hiring you.",
                    hook: "Everyone your age is getting ahead with AI. This is how you get ahead of them." },
      "manager":  { hl: "Give your team an AI framework<br/><span>you can actually teach.</span>",
                    sub: "One system for directing AI, simple enough to hand to your whole team. No technical training required.",
                    hook: "The professionals getting exceptional results are not more technical. They are more deliberate. This is the system." }
    };
    var ANG = {
      "status":   { hl: "Be the one<br/><span>they promote.</span>",
                    sub: "Make AI look easy while your coworkers fight with it. This is the framework that gets you noticed.",
                    hook: "Same tools, completely different results. The difference is learning to direct the tool instead of just asking it." },
      "time":     { hl: "A week's work<br/><span>before lunch.</span>",
                    sub: "Get your afternoons back. Learn to direct AI so it does the heavy lifting right the first time.",
                    hook: "Stop rewriting AI's garbage. The framework that gets it right on the first pass, every time." }
    };
    try {
      var p = new URLSearchParams(location.search);
      var pick = AUD[(p.get("aud") || "").toLowerCase()] || ANG[(p.get("v") || "").toLowerCase()] || null;
      if (pick) {
        document.getElementById("hl").innerHTML = pick.hl;
        document.getElementById("sub").textContent = pick.sub;
        document.getElementById("hook").textContent = pick.hook;
      }
    } catch (e) {}
  })();
</script>
