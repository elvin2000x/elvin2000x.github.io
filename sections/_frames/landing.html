<script>
  /* Step counter: the bar starts at step / steps; on later steps the checkout's
     funnel.js fills the real numbers. */
  document.querySelectorAll('[data-lp-progress]').forEach(function (el) {
    var s = +el.getAttribute('data-step') || 0, n = +el.getAttribute('data-steps') || 0;
    var bar = el.querySelector('[data-store-progress-bar]');
    if (bar && n) bar.style.width = Math.min(100, Math.round(s / n * 100)) + '%';
  });
  /* A buy button carries the visitor's UTMs from this tab (js/site.js keeps them),
     whatever page they first landed on. funnel.js does the same for its POST path. */
  document.querySelectorAll('a[data-store-checkout]').forEach(function (a) {
    a.addEventListener('click', function () {
      try {
        var u = new URL(a.href), t = window.EPUtm ? window.EPUtm.get() : {};
        Object.keys(t).forEach(function (k) { if (!u.searchParams.has(k)) u.searchParams.set(k, t[k]); });
        a.href = u.toString();
      } catch (e) {}
    });
  });
  /* Purchase pixels, once per order: the checkout's funnel.js fires store:purchase
     on the thank-you step. purchase_id is the dedupe id for every pixel. */
  document.addEventListener('store:purchase', function (e) {
    var d = e.detail || {}, id = String(d.purchase_id || ''), v = +d.value || 0, cur = d.currency || 'USD';
    if (!id) return;
    try { var k = 'ep_purchased_' + id; if (localStorage.getItem(k)) return; localStorage.setItem(k, '1'); } catch (x) {}
    try { gtag('event', 'purchase', { transaction_id: id, value: v, currency: cur }); } catch (x) {}
    try { fbq('track', 'Purchase', { value: v, currency: cur }, { eventID: id }); } catch (x) {}
    try { ttq.track('CompletePayment', { value: v, currency: cur }, { event_id: id }); } catch (x) {}
  });
</script>
