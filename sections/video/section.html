{{#url}}
<section class="ep-block ep-video ep-video--{{align}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
{{#heading}}
  <h2>{{heading}}</h2>
{{/heading}}
  <div class="ep-video__frame" data-video="{{url}}">
    <button type="button" class="ep-video__play" aria-label="Play video">
{{#poster}}
      <img src="{{poster}}" alt="{{poster_alt}}">
{{/poster}}
      <span class="ep-video__mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
    </button>
  </div>
{{#caption}}
  <p class="ep-video__cap">{{caption}}</p>
{{/caption}}
</section>
{{/url}}
