<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    {{#heading}}<h2>{{heading}}</h2>{{/heading}}
    <div class="lp-ba">
      <div class="lp-ba__panel lp-ba__panel--before">
        <p class="lp-ba__label">{{before_label}}</p>
        <p class="lp-ba__text">{{before}}</p>
      </div>
      <div class="lp-ba__panel lp-ba__panel--after">
        <p class="lp-ba__label">{{after_label}}</p>
        <p class="lp-ba__text">{{after}}</p>
      </div>
    </div>
{{#foot}}
    <p class="lp-note">{{foot}}</p>
{{/foot}}
  </div>
</section>
