<section class="sec{{#bg}} sec--{{bg}}{{/bg}}" id="{{anchor}}">
  <div class="in">
    <span class="eyebrow">{{eyebrow}}</span>
    <h2>{{heading}}</h2>
    <p>{{intro}}</p>
    <div class="parts">
{{#parts}}
      <details class="part"><summary><span class="pn">{{label}}</span><span class="pt">{{outcome}}</span><span class="pi" aria-hidden="true">+</span></summary><ul>{{#points}}<li>{{.}}</li>{{/points}}</ul></details>
{{/parts}}
    </div>
    <p class="value">{{value}}</p>
{{#buy}}
    {{>buybox}}
{{/buy}}
  </div>
</section>
