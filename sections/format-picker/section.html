<section class="sec{{#bg}} sec--{{bg}}{{/bg}}" id="{{anchor}}">
  <div class="in">
    <h2>{{heading}}</h2>
    <p class="price-line">{{price}}</p>
    <div class="formats" id="buy-format">
{{#formats}}
      <div class="fmt"><b>{{name}}</b><span>{{blurb}}</span><a class="btn btn--primary" id="{{bid}}" data-amazon href="{{amazon}}" target="_blank" rel="noopener" aria-label="{{aria}}">{{label}}</a></div>
{{/formats}}
    </div>
    <p>{{team}}</p>
    <div class="cards cards--2">
{{#cards}}
      <details class="card"><summary><span class="ct">{{title}}</span><span class="cl">{{line}}</span><span class="ci" aria-hidden="true">+</span></summary><div class="cx">{{body}}</div></details>
{{/cards}}
    </div>
  </div>
</section>
