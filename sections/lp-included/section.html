<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    <h2>{{heading}}</h2>
    <ul class="lp-included">
{{#items}}
      <li><strong>{{name}}</strong> <span>{{detail}}</span></li>
{{/items}}
    </ul>
{{#foot}}
    <p class="lp-note">{{foot}}</p>
{{/foot}}
  </div>
</section>
