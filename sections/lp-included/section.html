<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    <h2>{{heading}}</h2>
    <ul class="lp-included">
{{#items}}
      <li>{{#thumb}}<img class="lp-included__thumb" src="{{thumb}}" alt="{{thumb_alt}}" width="96" height="154" loading="lazy" decoding="async" />{{/thumb}}<div><strong>{{name}}</strong> <span>{{detail}}</span></div></li>
{{/items}}
    </ul>
{{#foot}}
    <p class="lp-note">{{foot}}</p>
{{/foot}}
  </div>
</section>
