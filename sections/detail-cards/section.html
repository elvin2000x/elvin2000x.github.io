<section class="sec{{#bg}} sec--{{bg}}{{/bg}}" id="{{anchor}}">
  <div class="in">
{{#eyebrow}}
    <span class="eyebrow">{{eyebrow}}</span>
{{/eyebrow}}
    <h2>{{heading}}</h2>
{{#intro}}
    <p>{{intro}}</p>
{{/intro}}
    <div class="cards{{#two_col}} cards--2{{/two_col}}">
{{#cards}}
      <details class="card"><summary><span class="ct">{{title}}</span><span class="cl">{{line}}</span><span class="ci" aria-hidden="true">+</span></summary>
        <div class="cx">{{body}}</div></details>
{{/cards}}
    </div>
{{#buy}}
    {{>buybox}}
{{/buy}}
  </div>
</section>
