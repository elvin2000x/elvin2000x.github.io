<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    <h2>{{heading}}</h2>
    <div class="lp-stack{{#layout}} lp-stack--{{layout}}{{/layout}}" data-lp-fstack="{{funnel}}" data-free="{{free_label}}" data-included="{{included_label}}"{{#thumbs_json}} data-thumbs='{{thumbs_json}}'{{/thumbs_json}}>
{{#preview_stack_json}}
      <script type="application/json" data-lp-stack-preview>{{preview_stack_json}}</script>
{{/preview_stack_json}}
      <div class="lp-shots">
{{#shots}}
        <figure class="lp-shot"><img src="{{src}}" alt="{{alt}}" width="280" height="420"><figcaption>{{caption}}</figcaption></figure>
{{/shots}}
      </div>
      <ul class="lp-stack__items" data-lp-rows></ul>
      <p class="lp-stack__total"><span>{{total_label}}</span> <strong data-lp-total></strong></p>
      <p class="lp-stack__price"><span>{{price_label}}</span> <strong data-lp-front></strong></p>
{{#email_label}}
      <form class="lp-pay" data-store-checkout="{{funnel}}">
        <label>{{email_label}}
          <input type="email" name="email" required autocomplete="email" placeholder="you@work.com">
        </label>
        <button type="submit" class="btn btn--primary btn--lg lp-cta">{{email_button}}</button>
      </form>
{{/email_label}}
{{#bump}}
      <label class="lp-bump lp-bump--box">{{#tab}}<span class="lp-bump__tab">{{tab}}</span>{{/tab}}{{#image}}<img src="{{image}}" alt="{{image_alt}}" loading="lazy">{{/image}}<input type="checkbox" data-store-bump> <span class="lp-bump__words"><strong>{{name}}</strong>{{#line}}<span>{{line}}</span>{{/line}}</span><strong class="lp-bump__price">{{price}}</strong></label>
{{/bump}}
{{#button}}
      {{>lp-button}}
{{/button}}
{{#note}}
      <p class="lp-note">{{note}}</p>
{{/note}}
    </div>
  </div>
</section>
