<section class="sec{{#bg}} sec--{{bg}}{{/bg}}" id="{{anchor}}">
  <div class="in">
    <span class="eyebrow">{{eyebrow}}</span>
    <h2>{{heading}}</h2>
    <p>{{intro}}</p>
    <div class="chmap" id="chmap" aria-label="Chapter map">
{{#map}}
      <div><b>{{label}}</b><span class="stops">{{#chapters}}<button type="button" title="{{title}}">{{n}}</button>{{/chapters}}</span></div>
{{/map}}
    </div>
    <p class="chcap" id="chcap" aria-live="polite">{{caption}}</p>
    <div class="cards">
{{#cards}}
      <details class="card part-card"><summary><span class="tag">{{tag}}</span><span class="ct">{{title}}</span><span class="ci" aria-hidden="true">+</span></summary>
        <div class="cx"><ul>
{{#points}}
          <li>{{.}}</li>
{{/points}}
        </ul></div></details>
{{/cards}}
    </div>
    <a class="sample" href="{{sample_href}}">{{sample}}</a>
  </div>
</section>
