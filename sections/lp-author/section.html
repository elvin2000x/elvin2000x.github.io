<section class="lp-sec{{#bg}} lp-sec--{{bg}}{{/bg}}"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
    <div class="lp-auth">
      <a class="lp-auth__cover" href="{{href}}"><img src="{{cover}}" alt="{{cover_alt}}" width="96" height="154" loading="lazy" decoding="async" /></a>
      <div>
        {{#heading}}<h2>{{heading}}</h2>{{/heading}}
        <p>{{text}}</p>
        <p><a href="{{href}}">{{link_label}}</a></p>
      </div>
    </div>
  </div>
</section>
