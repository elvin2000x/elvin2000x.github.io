<section class="lp-sec lp-hero"{{#anchor}} id="{{anchor}}"{{/anchor}}>
  <div class="lp-in">
{{#eyebrow}}
    <span class="lp-eyebrow">{{eyebrow}}</span>
{{/eyebrow}}
    <h1>{{headline}}</h1>
{{#sub}}
    <p class="lp-lede">{{sub}}</p>
{{/sub}}
{{#more}}
    <p class="lp-lede">{{more}}</p>
{{/more}}
{{#button}}
    <a class="btn btn--primary btn--lg lp-cta" href="{{href}}">{{label}}</a>
{{/button}}
{{#note}}
    <p class="lp-note">{{note}}</p>
{{/note}}
  </div>
</section>
