<script>
(function(){var t="light";try{t=localStorage.getItem("studio-theme")||"light";}catch(e){}
if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();

<link rel="stylesheet" href="/studio.css">
<style>
/* Site Studio additions. Tokens from studio.css only; no colours of our own. */
.menubtn{display:grid}
.rail.open{display:block;position:fixed;top:64px;left:0;bottom:0;z-index:60;background:var(--bg);width:280px;box-shadow:var(--shadow-lg);padding-top:8px}
@media (min-width:901px){.shell.norail .rail{display:none}.shell.norail .main{margin-left:16px}}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--primary-soft);color:var(--on-primary-soft);border-radius:12px;padding:10px 14px;margin:0 0 18px}
.banner.warn{background:var(--red-soft);color:var(--red)}
.banner.amber{background:var(--amber-soft);color:var(--amber)}
.banner .sp{flex:1}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}
.fmt{font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap}
.pvframe{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--container);position:relative}
.pvframe iframe{border:0;display:block;background:transparent;transform-origin:0 0}
.pvframe.phone{width:390px;max-width:100%;margin:0 auto;border-radius:28px;border:10px solid var(--container-hi)}
.pvcol{position:sticky;top:76px}
.pvcol .pvframe{height:calc(100vh - 150px)}
.writer.noset #setcol{display:none}
.writer.noset{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.writer.noset.nopreview{grid-template-columns:minmax(0,880px);justify-content:center}
.tbl td.nowrap{white-space:nowrap}
.pvnote{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.writer .toolbar{top:64px}
.writer #wcol{min-width:0}
.bodyin{font:15px/1.75 var(--mono)}
.titlein{resize:none;overflow:hidden;line-height:1.25;display:block}
.dekin{overflow:hidden;display:block}
.save.err{color:var(--red)}
.cover{display:flex;gap:12px;align-items:center}
.cover img{width:112px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--container)}
.count{font-size:12px;color:var(--muted);float:right;font-weight:400}
.count.over{color:var(--red);font-weight:600}
.lockcard{margin:16px 20px;padding:14px 16px;border-radius:10px;background:var(--container);color:var(--ink2);font-size:13.5px}
.lockcard b{color:var(--ink)}
.lockcard .btn{margin-top:10px}
.modalwrap{position:fixed;inset:0;z-index:75;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(1280px,100%);height:88vh}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 22px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px 22px;overflow:auto;flex:1}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:12px 22px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.log{font:12.5px/1.6 var(--mono);background:var(--container);border-radius:10px;padding:12px 14px;white-space:pre-wrap;max-height:40vh;overflow:auto;margin-top:12px}
.filelist{list-style:none;margin:8px 0 0;padding:0;font:12.5px var(--mono);color:var(--ink2)}
.filelist li{padding:3px 0}
.item{border:1px solid var(--line);border-radius:12px;margin:12px 0 0;background:var(--surface)}
.item>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;cursor:pointer;font-weight:600}
.item>summary::-webkit-details-marker{display:none}
.item .form{padding-top:0}
.item.over{box-shadow:0 -2px 0 var(--primary)}
.item.drag{opacity:.4}
.item .grip{cursor:grab;color:var(--muted);width:24px;display:grid;place-items:center}
.item .it{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .iconbtn{width:34px;height:34px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px}
.cheat{font-size:13px;line-height:1.9}
.cheat code{white-space:nowrap}
.kbd{font:12px var(--font);border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;color:var(--ink2)}
.pagecards .app{cursor:pointer}
@media (max-width:1280px){.pvcol{position:static}.pvcol .pvframe{height:70vh}}
@media (max-width:1280px) and (min-width:901px){.writer.noset:not(.nopreview){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.writer.noset .pvcol{grid-column:auto;order:0;position:sticky}.writer.noset .pvcol .pvframe{height:calc(100vh - 150px)}}
@media (max-width:900px){
  .menubtn{display:grid}
  .modal.wide{height:92vh}
  .writer .toolbar{position:static}
  .titlein{font-size:24px;padding:14px 14px 4px}.dekin{padding:0 14px 10px}.bodyin{padding:10px 14px 30px;min-height:420px}
  .head .seg{order:5}
  .writer,.writer.noset,.writer.noset.nopreview{grid-template-columns:minmax(0,1fr)}
  #toast{left:12px;right:12px}
}
</style>
</head>

<script>
"use strict";
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var icon = function(id, style){ return '<svg class="i"' + (style ? ' style="' + style + '"' : '') + '><use href="#i-' + id + '"/></svg>'; };
var isExt = function(u){ return u.charAt(0) !== "#"; };
var tgt = function(u){ return isExt(u) ? ' target="_blank" rel="noopener"' : ""; };
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ================= Server ================= */
function api(method, url, body, headers){
  var h = Object.assign({"X-Studio": "1"}, headers || {});
  var opt = {method: method, headers: h};
  if (body !== undefined) opt.body = (typeof body === "string" || body instanceof Blob) ? body : JSON.stringify(body);
  return fetch(url, opt).then(function(r){
    var ct = r.headers.get("content-type") || "";
    return (ct.indexOf("json") > -1 ? r.json() : r.text()).then(function(data){
      if (!r.ok) { var err = new Error((data && data.error) || ("HTTP " + r.status)); err.status = r.status; err.data = data; throw err; }
      return {data: data, etag: (r.headers.get("etag") || "").replace(/"/g, "")};
    });
  });
}

var REG = {tools: [], external: [], home: "https://studio.elvinpeters.com/studio/"};
var STATE = null, SECTIONS = {}, DOCS = {}, VERS = {}, HISTORY = null;
var saveTimers = {}, saveBusy = {}, saveAgain = {};

function loadDoc(name){
  return api("GET", "/api/content/" + name).then(function(r){ DOCS[name] = r.data; VERS[name] = r.etag; return r.data; });
}
function refreshState(){
  return api("GET", "/api/state").then(function(r){
    STATE = r.data; SECTIONS = {};
    STATE.sections.forEach(function(s){ SECTIONS[s.name] = s; });
    return STATE;
  });
}
function posts(){ var d = DOCS.essays; return Array.isArray(d) ? d : d.posts; }

/* Autosave: one PUT per section, debounced, never two at once, stale-safe. */
function queueSave(name, delay){
  setSave("saving");
  clearTimeout(saveTimers[name]);
  saveTimers[name] = setTimeout(function(){ saveNow(name); }, delay == null ? 700 : delay);
}
function saveNow(name){
  clearTimeout(saveTimers[name]);
  if (saveBusy[name]) { saveAgain[name] = true; return saveBusy[name]; }
  var bad = name === "essays" ? validatePosts() : "";
  if (bad) { setSave("wait", bad); return Promise.resolve(false); }
  setSave("saving");
  saveBusy[name] = api("PUT", "/api/content/" + name, DOCS[name], {"If-Match": VERS[name] || ""}).then(function(r){
    VERS[name] = r.data.version; saveBusy[name] = null;
    if (saveAgain[name]) { saveAgain[name] = false; return saveNow(name); }
    setSave("saved"); pendingChanges(true);
    return true;
  }).catch(function(e){
    saveBusy[name] = null;
    if (e.data && e.data.retry) { setTimeout(function(){ saveNow(name); }, 3000); setSave("wait", "Publishing… will save right after"); return false; }
    setSave("error", e.message);
    if (e.status === 409) conflict(e.message);
    return false;
  });
  return saveBusy[name];
}
function flushSaves(){
  return Promise.all(Object.keys(saveTimers).map(function(n){ return saveTimers[n] ? saveNow(n) : true; }).concat(
    Object.keys(saveBusy).map(function(n){ return saveBusy[n]; }).filter(Boolean)));
}
var saveState = "saved";
function setSave(kind, msg){
  saveState = kind;
  var s = $("#savestate"); if (!s) return;
  s.classList.toggle("err", kind === "error" || kind === "wait");
  if (kind === "saving") s.textContent = "Saving…";
  else if (kind === "saved") s.innerHTML = icon("check", "width:16px;height:16px") + "All changes saved";
  else s.textContent = (kind === "error" ? "Not saved: " : "") + (msg || "");
}
function conflict(msg){
  showModal('<div class="mh"><h2>Someone else changed this</h2></div><div class="mb"><p>' + esc(msg) + '</p><p class="subtle">Reloading brings in the latest copy. Anything you typed in the last few seconds may need to be typed again.</p></div>' +
    '<div class="mf"><button class="btn" onclick="closeModal()">Keep editing</button><button class="btn filled" onclick="location.reload()">Reload</button></div>');
}
window.addEventListener("beforeunload", function(e){ if (saveState === "saving") { e.preventDefault(); e.returnValue = ""; } });

/* ================= Rail, drawer, launcher ================= */
function drawRail(){
  var byG = {}, order = [];
  REG.tools.filter(function(t){ return t.rail; }).forEach(function(t){ if (!byG[t.g]) { byG[t.g] = []; order.push(t.g); } byG[t.g].push(t); });
  var h = '<button class="create" id="createbtn">' + icon("plus") + 'Create</button><ul class="nav"><li><a href="' + esc(REG.home) + '">' + icon("home") + 'Home</a></li></ul>';
  order.forEach(function(g){
    h += '<div class="navhead">' + esc(g) + '</div><ul class="nav">' + byG[g].map(function(t){
      var self = t.id === "site";
      return '<li><a href="' + (self ? "#posts" : esc(t.u)) + '"' + (self ? "" : ' rel="noopener"') + ' data-help="' + esc(t.id) + '"' + (self ? ' class="on" aria-current="page"' : '') + '>' + icon(t.i) + esc(t.n) + '</a></li>';
    }).join("") + '</ul>';
  });
  h += '<div class="navhead">Admin</div><ul class="nav"><li><a href="#settings" data-nav="settings">' + icon("gear") + 'Settings</a></li></ul>';
  $("#rail").innerHTML = h;
  $("#createbtn").onclick = function(e){ e.stopPropagation(); openCreate(this); };
}
function toolUrl(id){ var t = REG.tools.filter(function(x){ return x.id === id; })[0]; return t ? t.u : REG.home; }
function openCreate(btn){
  var m = $("#createmenu");
  if (!m) { m = document.createElement("div"); m.id = "createmenu"; m.className = "menu"; document.body.appendChild(m); }
  var r = btn.getBoundingClientRect();
  m.style.position = "fixed"; m.style.left = r.left + "px"; m.style.top = (r.bottom + 6) + "px";
  var items = [["Blog post", "Write and preview a post", "web", "#post-new", false],
    ["Link page", "A new link-in-bio page", "link", toolUrl("links"), true],
    ["Quiz", "Start from a copy or blank", "quiz", toolUrl("quizzes"), true],
    ["Landing page", "A one-off campaign page", "layout", toolUrl("landing"), true]];
  m.innerHTML = items.map(function(x){

function wireSection(){
  var root = SECROOT, data = DOCS[SEC.name];

    var key = listEl.dataset.list, arr = getPath(data, key);

          else if (b.dataset.dupi) { arr.splice(i + 1, 0, JSON.parse(JSON.stringify(arr[i]))); OPENITEM[key] = i + 1; sectionChanged(true); toast("Duplicated", function(){ arr.splice(i + 1, 1); sectionChanged(true); }); }

        };
      });
      it.addEventListener("dragstart", function(e){ if (e.target !== it) return; it.classList.add("drag"); e.dataTransfer.setData("text/plain", key + "|" + i); });
      it.addEventListener("dragend", function(){ it.classList.remove("drag"); });
      it.addEventListener("dragover", function(e){ e.preventDefault(); it.classList.add("over"); });
      it.addEventListener("dragleave", function(){ it.classList.remove("over"); });
      it.addEventListener("drop", function(e){
        e.preventDefault(); it.classList.remove("over");
        var parts = (e.dataTransfer.getData("text/plain") || "").split("|"); if (parts[0] !== key) return;
        var from = +parts[1]; if (from === i) return;
        var moved = arr.splice(from, 1)[0]; arr.splice(i, 0, moved); OPENITEM[key] = null; sectionChanged(true);
      });
    });
  });
  $$("[data-add]", root).forEach(function(b){
    b.onclick = function(){
      var f = SEC.fields.filter(function(x){ return x.key === b.dataset.add; })[0], arr = getPath(data, f.key);

      Object.assign(blank, f.item_defaults || {});
      arr.push(blank); OPENITEM[f.key] = arr.length - 1; sectionChanged(true);
    };
  });
}

      '<div class="pvframe" data-pv style="height:calc(100vh - 170px)"></div><div class="pvnote" data-pvnote>Updates a moment after you stop typing.</div>';

function fitFrame(host, f){
  function fit(){
    var w = host.clientWidth, h = host.clientHeight;
    if (!w) return;
    if (pvDevice === "phone") { f.style.width = "100%"; f.style.height = h + "px"; f.style.transform = ""; return; }

/* Formatting */
function fmt(cmd){
  var b = $("#pbody"); if (!b) return;
  var s = b.selectionStart, e = b.selectionEnd, v = b.value, sel = v.slice(s, e);
  var lineStart = v.lastIndexOf("\n", s - 1) + 1;
  var wrap = function(pre, post, ph){
    var t = sel || ph;
    b.setRangeText(pre + t + post, s, e, "end");
    if (!sel) b.setSelectionRange(s + pre.length, s + pre.length + t.length);
  };
  var prefixLines = function(fn){
    var endLine = v.indexOf("\n", e); if (endLine < 0) endLine = v.length;
    var block = v.slice(lineStart, endLine), n = 0;
    var out = block.split("\n").map(function(l){ return fn(l, n++); }).join("\n");
    b.setRangeText(out, lineStart, endLine, "end");
  };
  if (cmd === "bold") wrap("**", "**", "bold text");
  else if (cmd === "italic") wrap("*", "*", "italic text");
  else if (cmd === "code") { if (sel.indexOf("\n") > -1) b.setRangeText("\n```\n" + sel + "\n```\n", s, e, "end"); else wrap("`", "`", "code"); }
  else if (cmd === "prompt") b.setRangeText("\n```prompt\n" + (sel || "Paste the prompt here") + "\n```\n", s, e, "end");
  else if (cmd === "link") {
    var href = /^https?:\/\//.test(sel) ? sel : "https://";
    var text = /^https?:\/\//.test(sel) ? "link text" : (sel || "link text");
    b.setRangeText("[" + text + "](" + href + ")", s, e, "end");
    var at = s + text.length + 3; if (href === "https://") b.setSelectionRange(at, at + href.length); else b.setSelectionRange(s + 1, s + 1 + text.length);
  }
  else if (cmd === "h2" || cmd === "h3") prefixLines(function(l){ return (cmd === "h2" ? "## " : "### ") + l.replace(/^#{1,6}\s*/, ""); });
  else if (cmd === "quote") prefixLines(function(l){ return /^> /.test(l) ? l.slice(2) : "> " + l; });
  else if (cmd === "list") prefixLines(function(l){ return /^[-*] /.test(l) ? l.slice(2) : "- " + l.replace(/^\d+[.)]\s+/, ""); });
  else if (cmd === "olist") prefixLines(function(l, n){ return /^\d+[.)] /.test(l) ? l.replace(/^\d+[.)]\s+/, "") : (n + 1) + ". " + l.replace(/^[-*]\s+/, ""); });
  else if (cmd === "note") b.setRangeText((lineStart === s ? "" : "\n\n") + "> [!note]\n> " + (sel || "Something the reader should not miss.") + "\n", s, e, "end");
  else if (cmd === "image") { pickFile(function(file){ uploadImage(file, "inline"); }); return; }
  b.focus(); b.dispatchEvent(new Event("input"));
}
function bodyKeys(e){
  var b = e.target;
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey && b.selectionStart === b.selectionEnd) {
    var v = b.value, s = b.selectionStart, ls = v.lastIndexOf("\n", s - 1) + 1, line = v.slice(ls, s);
    var m = /^(\s*)([-*] |(\d+)([.)]) |> )(.*)$/.exec(line);
    if (m) {
      e.preventDefault();
      if (!m[5].trim()) { b.setRangeText("", ls, s, "end"); }
      else { var next = m[3] ? (+m[3] + 1) + m[4] + " " : m[2]; b.setRangeText("\n" + m[1] + next, s, s, "end"); }
      b.dispatchEvent(new Event("input")); return;
    }
  }
  if (!(e.ctrlKey || e.metaKey)) return;
  var k = e.key.toLowerCase(), map = {b: "bold", i: "italic", k: "link", e: "code"};
  if (e.altKey && (k === "2" || k === "3")) { e.preventDefault(); fmt("h" + k); return; }
  if (e.shiftKey && (e.key === "*" || e.code === "Digit8")) { e.preventDefault(); fmt("list"); return; }
  if (e.shiftKey && (e.key === "&" || e.code === "Digit7")) { e.preventDefault(); fmt("olist"); return; }
  if (e.shiftKey && (e.key === ">" || e.code === "Period")) { e.preventDefault(); fmt("quote"); return; }
  if (map[k] && !e.shiftKey && !e.altKey) { e.preventDefault(); e.stopPropagation(); fmt(map[k]); }
}
function cheatSheet(){
  var rows = [["## Heading", "Section heading"], ["### Sub-heading", "Smaller heading"], ["**bold**  *italic*  `code`", "Inline styles"], ["[text](https://…)", "Link"],

    ["```prompt … ```", "Copy-paste prompt block"], ["```tree … ```", "File tree"], ["| a | b |  then  |---|---:|", "Table (---: right-aligns numbers)"], ["![alt](/img/uploads/… \"caption\")", "Image (use the image button, or paste one)"]];

function uploadImage(file, where){

  var b = $("#pbody"), at = b ? b.selectionStart : 0, marker = "![Uploading " + file.name.replace(/[\[\]()]/g, "") + "…]()";
  if (where === "inline" && b) { b.setRangeText("\n" + marker + "\n", at, b.selectionEnd, "end"); POST.body = b.value; }
  toast("Uploading " + file.name + "…");
  api("POST", "/api/upload?name=" + encodeURIComponent(file.name === "image.png" ? (POST.slug || "image") : file.name), file, {"Content-Type": "application/octet-stream"}).then(function(r){
    var d = r.data;

      POST.image = d.image; if (!/\.webp$/.test(d.image)) POST.og = d.image;
      $("#coverimg").src = d.src;
      toast("Cover set" + (d.width < 1200 ? ". It is " + d.width + "px wide; 1200px or more looks sharper when shared." : "."));
      postChanged({shell: true});
    } else if (b) {
      var alt = file.name.replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ").replace(/[\[\]()]/g, "");
      var v = b.value.replace(marker, "![" + alt + "](" + d.src + ")");
      b.value = v; POST.body = v; b.dispatchEvent(new Event("input"));
      toast("Image added. Edit the words in [brackets] to describe it for screen readers.");

  }).catch(function(e){
    if (where === "inline" && b) { b.value = b.value.replace("\n" + marker + "\n", ""); POST.body = b.value; b.dispatchEvent(new Event("input")); }
    toast("Upload failed: " + e.message);
  });
}

}

function runPublish(){
  var go = $("#pubgo"), log = $("#publog"), msg = $("#pubmsg").value;
  go.disabled = true; go.textContent = "Publishing…"; $("#pubcancel").disabled = true;
  log.classList.remove("hidden"); log.textContent = "";
  fetch("/api/publish?msg=" + encodeURIComponent(msg), {method: "POST", headers: {"X-Studio": "1"}}).then(function(r){
    if (!r.ok || !r.body) return r.text().then(function(t){ throw new Error(t); });
    var reader = r.body.getReader(), dec = new TextDecoder();
    var pump = function(){
      return reader.read().then(function(x){
        if (x.done) return;
        log.textContent += dec.decode(x.value, {stream: true}); log.scrollTop = log.scrollHeight;
        return pump();
      });
    };
    return pump();
  }).then(function(){
    var ok = /PUBLISHED|Nothing changed/.test(log.textContent);
    $("#pubcancel").disabled = false; $("#pubcancel").textContent = "Close";
    go.innerHTML = ok ? icon("check", "width:18px;height:18px") + "Done" : "Try again";
    go.disabled = false; go.onclick = ok ? closeModal : runPublish;
    if (ok) toast(/PUBLISHED/.test(log.textContent) ? "Published. Live in about a minute." : "Everything was already live.");
    HISTORY = null;
    return Promise.all([refreshState(), loadDoc("essays")]);
  }).then(function(){ var w = $("#pendingwrap"); if (w && !POST) w.innerHTML = pendingBanner(); if (SITETAB === "history" && !POST) drawHistory(); })
    .catch(function(e){ log.textContent += "\n✗ " + e.message; go.disabled = false; go.textContent = "Try again"; go.onclick = runPublish; $("#pubcancel").disabled = false; });
}

  return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
}

      return Promise.all([refreshState(), loadDoc("essays")]);
    }).then(function(){ if (SITETAB === "history") { $("#main").innerHTML = viewSite(); wireSite(); } })
      .catch(function(e){ var l = $("#revlog"); if (l) { l.classList.remove("hidden"); l.textContent = e.message; } b.disabled = false; b.textContent = "Try again"; });
  };
}

/* ================= Settings ================= */
function viewSettings(){
  return '<div class="head"><h1>Settings</h1></div><div class="card" style="max-width:640px"><div class="panel-h"><h2>Appearance</h2></div><div class="menu" style="position:static;box-shadow:none;border:0">' + themeOptions() + '</div></div>' +
    '<p class="subtle" style="max-width:640px;font-size:13px;margin-top:14px">The same appearance setting is shared by every Studio tool on this browser. Previews of the website always use the website’s own design.</p>';
}

/* ================= Ctrl K palette ================= */
var pIdx = 0, pRes = [];
function openPalette(){ closePops(); $("#scrim").classList.remove("hidden"); $("#palette").classList.remove("hidden"); var i = $("#pin"); i.value = ""; pIdx = 0; drawPalette(); i.focus(); }
function paletteItems(){
  var items = [{n: "Write a blog post", d: "Action", u: "#post-new", i: "plus"}, {n: "Publish the website", d: "Action", run: openPublish, i: "rocket"},
    {n: "Publish history and roll back", d: "Action", u: "#history", i: "history"}, {n: "Edit the menu", d: "Action", u: "#menu", i: "list"},
    {n: "Switch to Dark theme", d: "Appearance", run: function(){ setTheme("dark"); }, i: "palette"}, {n: "Switch to Signature theme", d: "Appearance", run: function(){ setTheme("signature"); }, i: "palette"},
    {n: "Switch to Light theme", d: "Appearance", run: function(){ setTheme("light"); }, i: "palette"}];
  if (DOCS.essays) posts().forEach(function(p){ items.push({n: p.title || p.slug, d: p.draft ? "Draft post" : "Blog post", u: "#post/" + p.slug, i: "web", x: p.slug}); });
  Object.keys(SECTIONS).filter(function(n){ return n !== "essays" && n !== "nav"; }).forEach(function(n){ items.push({n: SECTIONS[n].title, d: "Page", u: "#page/" + n, i: "layout"}); });
  REG.tools.forEach(function(t){ if (t.id !== "site") items.push({n: t.n, d: t.pc ? "Studio tool · PC only" : "Studio tool", u: t.u, i: t.i, x: t.d + " " + t.help}); });
  REG.external.forEach(function(t){ items.push({n: t.n, d: "External · " + t.g, u: t.u, i: "open", x: t.d}); });
  return items;
}
function drawPalette(){
  var q = $("#pin").value.toLowerCase().trim(), terms = q.split(/\s+/).filter(Boolean);
  pRes = paletteItems().filter(function(r){ var hay = (r.n + " " + r.d + " " + (r.x || "")).toLowerCase(); return terms.every(function(w){ return hay.indexOf(w) > -1; }); }).slice(0, q ? 14 : 9);
  pIdx = Math.min(pIdx, Math.max(pRes.length - 1, 0));
  $("#pres").innerHTML = (q ? "" : '<div class="pgh">Suggested</div>') + (pRes.length ? pRes.map(function(r, k){
    return '<a class="pr' + (k === pIdx ? " on" : "") + '" data-k="' + k + '"' + (r.u ? ' href="' + esc(r.u) + '"' + tgt(r.u) : ' href="#" ') + '>' + icon(r.i) + '<span>' + esc(r.n) + '</span><small>' + esc(r.d) + '</small></a>';
  }).join("") : '<div class="empty">No match. Try a post title, “menu” or “dark”.</div>');
  $$("#pres a").forEach(function(a){ a.onclick = function(e){ var r = pRes[+a.dataset.k]; if (r.run) { e.preventDefault(); closePops(); r.run(); return; } closePops(); }; });
}
$("#pin").addEventListener("input", function(){ pIdx = 0; drawPalette(); });
$("#pin").addEventListener("keydown", function(e){
  var n = pRes.length; if (!n) return;
  if (e.key === "ArrowDown") { pIdx = (pIdx + 1) % n; drawPalette(); e.preventDefault(); }
  if (e.key === "ArrowUp") { pIdx = (pIdx - 1 + n) % n; drawPalette(); e.preventDefault(); }
  if (e.key === "Enter") { var a = $$("#pres a")[pIdx]; if (a) a.click(); }
});
$("#searchbox").onclick = openPalette;
$("#searchbox").onkeydown = function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPalette(); } };
document.addEventListener("keydown", function(e){
  var k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "k" && e.target.id !== "pbody") { e.preventDefault(); openPalette(); }
  if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); flushSaves().then(function(){ if (saveState === "saved") toast("Saved. Publish when you are ready."); }); }
  if (e.key === "Escape") { if (!$("#modal").classList.contains("hidden")) { var busy = $("#pubgo") && $("#pubgo").textContent === "Publishing…"; if (!busy) closeModal(); } else { closePops(); closeDrawer(); } }
});

/* ================= Boot ================= */
Promise.all([
  fetch("/tools.json").then(function(r){ return r.json(); }).then(function(t){ REG = {tools: t.tools || [], external: t.external || [], home: t.home || REG.home}; }).catch(function(){}),
  refreshState(),
  loadDoc("essays")
]).then(function(){
  $("#brandlink").href = REG.home;
  drawRail(); route();
  setInterval(function(){ if (document.visibilityState === "visible" && !POST) pendingChanges(); }, 60000);
}).catch(function(e){
  drawRail();
  $("#main").innerHTML = '<div class="banner warn">' + icon("flag") + '<span>Site Studio could not load: ' + esc(e.message) + '</span></div>';
});
</script>
</body>
</html>
